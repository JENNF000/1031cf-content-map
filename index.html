<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#ffffff">
<title>1031CF Content Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f9f9f7; --panel:#ffffff; --ink:#0b0b0b; --muted:#52514e; --faint:#898781;
  --line:#e1e0d9; --hair:rgba(11,11,11,.10);
  --navy:#1f4e79; --navy-soft:#eef2f6;
  /* Jennifer's tier colors (8/23): band fills are her exact hexes; the darker
     steps derived from each are used where a fill won't read (dots, ticks). */
  --trans-bg:#b8d4bc; --pillar-bg:#8bb0e0; --fanout-bg:#9accd8bd; --redir-bg:#dedee1;
  --trans:#54815c; --pillar:#3d69a5; --fanout:#48899a; --redir:#87878f;
  --crit:#d03b3b; --ser:#c05621; --warn:#9a6700; --ok:#006300; --info:#898781;
  --r:6px; font-size:15px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--navy)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

header.app{position:sticky;top:0;z-index:40;background:var(--panel);color:var(--ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
header.app h1{font-size:15px;margin:0 10px 0 0;font-weight:650;letter-spacing:.2px;color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:3px 9px;font-size:12px;background:#f1f1ee;color:var(--muted);border:1px solid var(--line)}
.chip.amber{background:#fdf6e3;border-color:#e8d9a8;color:#7a5a10}
.chip button,button.chip{cursor:pointer}
header .spacer{flex:1}
.hbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 12px;font-size:13px}
.hbtn:hover{border-color:var(--navy);color:var(--navy)}
.hbtn.spin::before{content:"↻ ";display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav.tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:52px;z-index:30}
nav.tabs button{border:0;background:none;padding:10px 13px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
nav.tabs button .n{background:var(--navy-soft);color:var(--navy);border-radius:4px;font-size:11px;padding:1px 6px;margin-left:5px}

main{padding:14px 16px 90px;max-width:100%}
.note-strip{background:#fdf6e3;border:1px solid #e8d9a8;color:#7a5a10;border-radius:var(--r);padding:8px 12px;font-size:13px;margin:0 0 12px}
.intro{font-size:13px;color:var(--muted);margin:2px 0 12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.tile .v{font-size:24px;font-weight:650;color:var(--ink)}
.tile .l{font-size:12px;color:var(--faint)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px;padding:7px 11px;border:1px solid var(--line);border-radius:4px;font:inherit;background:var(--panel)}
.toolbar select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;font:inherit;background:var(--panel);max-width:180px}
.toolbar .count{font-size:12.5px;color:var(--faint);margin-left:auto}
.toolbar label.tog{font-size:12.5px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

#matrix{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{min-width:248px;max-width:248px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);flex-shrink:0}
.col>.head{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:650;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);border-radius:var(--r) var(--r) 0 0}
.col>.head .k{font-weight:400;color:var(--faint);font-size:11.5px}
.band{margin:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.band>.bh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:650;padding:4px 9px;background:#f6f6f4;color:#2c332e;border-left:3px solid var(--faint)}
.band>.bh .bn{background:rgba(255,255,255,.85);border:1px solid var(--hair);border-radius:4px;padding:0 6px;font-size:11px;color:var(--ink)}
.band.b-transactional>.bh{background:var(--trans-bg);border-left-color:var(--trans);color:#243b29}
.band.b-pillar>.bh{background:var(--pillar-bg);border-left-color:var(--pillar);color:#1c3050}
.band.b-fanout>.bh{background:var(--fanout-bg);border-left-color:var(--fanout);color:#1e3d46}
.band.b-redirect>.bh{background:var(--redir-bg);border-left-color:var(--redir);color:#3c3c42}
.band .cells{padding:5px}
.band.dropok{outline:2px dashed var(--navy);outline-offset:-3px;background:var(--navy-soft)}
.cell{display:block;position:relative;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 8px;margin:4px 0;font-size:12.6px;line-height:1.3;color:var(--ink);text-decoration:none;cursor:grab}
.cell:hover{border-color:var(--navy)}
.cell .kwn{color:var(--faint);font-size:11px;margin-left:4px}
.cell.redir-cell{background:#f7f9fb;border-style:dashed}
.cell .to{display:block;font-size:11px;color:var(--redir);margin-top:2px;word-break:break-all}
.cell .pills{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
.apill{font-size:10px;border-radius:3px;padding:0 6px;line-height:16px;white-space:nowrap}
.apill.auto-l{background:var(--panel);border:1px solid currentColor}
.apill.mine{border:0;color:#fff}
.spill{font-size:10px;border-radius:3px;padding:0 5px;line-height:16px;color:#fff;white-space:nowrap;display:inline-block}
.cell .edit{position:absolute;top:3px;right:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-size:11px;padding:0 5px;display:none}
.cell:hover .edit{display:block}
.cell.dim{opacity:.25}
.cell .cmt{font-size:10px;color:var(--warn)}
body.compact .cell .pills,body.compact .cell .to{display:none}
body.compact .cell{padding:4px 7px}

#ghost{position:fixed;z-index:100;pointer-events:none;background:var(--panel);border:1.5px solid var(--navy);border-radius:4px;padding:5px 9px;font-size:12.5px;box-shadow:0 2px 10px rgba(11,11,11,.15);max-width:230px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a1a19;color:#fff;border-radius:6px;padding:9px 16px;font-size:13.5px;z-index:120;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#9ec5f4;font-weight:650}

table.grid{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:13px}
table.grid th{background:#f6f6f4;color:var(--muted);text-align:left;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line)}
table.grid td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
table.grid tr:hover td{background:#f9f9f7}
.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
.tablewrap table.grid{border:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10.5px;border-radius:3px;padding:1px 7px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.badge.soft{border-color:#e5b9b9;color:var(--crit)}
.badge.sm{border-color:#e8d9a8;color:#7a5a10}
.badge[class*="tier-"]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--faint)}
.badge.tier-transactional::before{background:var(--trans)}
.badge.tier-pillar::before{background:var(--pillar)}
.badge.tier-fanout::before{background:var(--fanout)}
.badge.tier-redirect::before{background:var(--redir)}
.badge.stale{border-style:dashed;color:var(--faint)}

.insight{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:var(--r);padding:11px 14px;margin-bottom:10px}
.insight.critical{border-left-color:var(--crit)} .insight.serious{border-left-color:var(--ser)}
.insight.warning{border-left-color:var(--warn)} .insight.ok{border-left-color:var(--ok)}
.insight h3{margin:0 0 4px;font-size:14.5px}
.insight p{margin:0;font-size:13px;color:var(--muted)}
.insight ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.insight .sev{float:right;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.insight.critical .sev{color:var(--crit)} .insight.serious .sev{color:var(--ser)}
.insight.warning .sev{color:var(--warn)} .insight.ok .sev{color:var(--ok)} .insight.info .sev{color:var(--info)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:10px}
.group h4{margin:0 0 3px;font-size:14px}
.group .meta{font-size:12px;color:var(--faint);margin-bottom:6px}
.group .u{font-size:12.5px;padding:2px 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.group .u .tag{font-size:10px;border-radius:3px;padding:0 5px;font-weight:700}
.tag.keep{background:#e9f3ec;color:var(--ok)} .tag.live{background:#fbeaea;color:var(--crit)}
.tag.done{background:#eaf1fa;color:var(--trans)} .tag.gone{background:#f1f1ee;color:var(--muted)}

#tooltip{position:fixed;z-index:110;background:#1a1a19;color:#f4f4f2;border-radius:6px;padding:10px 13px;font-size:12.5px;max-width:320px;box-shadow:0 6px 24px rgba(0,0,0,.28);pointer-events:none;line-height:1.5}
#tooltip .t{font-weight:650;font-size:13px;margin-bottom:5px}
#tooltip table{border-collapse:collapse}
#tooltip td{padding:1px 0}
#tooltip td:first-child{color:#a8a79f;padding-right:14px;white-space:nowrap}
#tooltip .stale{color:#d8c27a;font-size:11px;margin-top:5px}
#tooltip .nodata{color:#d8c27a}

.drawer-scrim{position:fixed;inset:0;background:rgba(11,11,11,.32);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--panel);z-index:70;box-shadow:-6px 0 24px rgba(0,0,0,.15);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer .dh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0 0 2px;font-size:16px;padding-right:30px}
.drawer .dh .p{font-size:12px;color:var(--faint);word-break:break-all}
.drawer .dx{position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;color:var(--faint)}
.drawer .body{flex:1;overflow-y:auto;padding:12px 16px 30px}
.sec{margin-bottom:16px}
.sec h5{margin:0 0 6px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:13px}
.kv .k{color:var(--faint)}
.row2{display:flex;gap:8px}
.row2 select{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font:inherit;background:var(--panel)}
.drawer input[type=text]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:4px;font:inherit}
.pillrow{display:flex;flex-wrap:wrap;gap:5px}
.pillrow .apill{font-size:11.5px;line-height:22px;padding:0 10px;cursor:pointer;user-select:none}
.pillrow .apill.off{opacity:.38}
.comment{border:1px solid var(--line);border-radius:4px;padding:7px 10px;margin-bottom:7px;font-size:13px}
.comment .m{font-size:11px;color:var(--faint);display:flex;justify-content:space-between}
.comment .m button{border:0;background:none;color:var(--crit);font-size:11px}
.addc{display:flex;gap:7px}
.addc input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:4px;font:inherit}
.btn{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:7px 14px;font-size:13.5px}
.btn.sub{background:var(--panel);color:var(--navy);border:1px solid var(--navy)}
.btn.danger{background:var(--crit)}
.mini{font-size:11.5px;color:var(--faint)}

.modal-scrim{position:fixed;inset:0;background:rgba(11,11,11,.36);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:8px;border:1px solid var(--line);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 8px;font-size:17px}
.modal textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:4px;font:inherit;padding:8px 10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.libitem{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.libitem input[type=text]{flex:1;padding:4px 8px;border:1px solid var(--line);border-radius:4px;font:inherit}
.libitem .use{font-size:11px;color:var(--faint);white-space:nowrap}
.libitem button{border:0;background:none;font-size:13px;color:var(--faint)}
.swatch{position:relative;width:20px;height:20px;border-radius:4px;border:1px solid var(--hair);cursor:pointer;flex-shrink:0;overflow:hidden}
.swatch input[type=color]{position:absolute;inset:-6px;width:34px;height:34px;opacity:0;cursor:pointer;padding:0;border:0}
.diff{font-size:12.5px;background:#f9f9f7;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-top:8px;max-height:200px;overflow-y:auto}

#updatebar{position:fixed;bottom:0;left:0;right:0;background:#1a1a19;color:#fff;padding:10px 16px;font-size:13.5px;display:flex;gap:14px;align-items:center;justify-content:center;z-index:90}
#updatebar button{background:var(--navy);border:0;color:#fff;border-radius:4px;padding:5px 14px}
footer{padding:20px 16px;font-size:11.5px;color:var(--faint)}
@media (max-width:640px){
  .col{min-width:86vw;max-width:86vw}
  nav.tabs{top:auto}
}
</style>
</head>
<body>
<header class="app">
  <h1>1031CF Content Map</h1>
  <span class="chip" id="chip-data" title="SEMrush build vintage">Data —</span>
  <button class="chip" id="chip-redir" title="When redirect status was last verified. Click to update.">Redirects —</button>
  <span class="chip" id="chip-sync">Sync: off</span>
  <span class="spacer"></span>
  <button class="hbtn" id="btn-check">Check redirects</button>
  <button class="hbtn" id="btn-sync">Sync setup</button>
  <button class="hbtn" id="btn-refresh" title="Pull the latest published data and your notes">Refresh</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>1031 Crowdfunding content topic map · private working tool · data vintages shown in the header chips. Not indexed (robots noindex + robots.txt).</footer>
<div id="updatebar" class="hidden"><span>A new version of the app is ready.</span><button id="btn-reload">Reload</button></div>
<script src="app.js"></script>
</body>
</html>
