name: Site crawl & rebuild
on:
  workflow_dispatch: {}        # triggered by the app's Refresh button (or the Run workflow button here)
  schedule:
    - cron: '0 13 * * *'       # daily, 6am PT
concurrency:
  group: crawl
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl and rebuild data.json
        run: python crawler/crawl_build.py
      - name: Commit if changed
        run: |
          git config user.name "content-map-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add data.json version.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "crawl: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
